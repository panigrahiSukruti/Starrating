services:
  - type: web
    name: storerating-app
    env: node
    plan: free
    buildCommand: npm run install:all && cd server && npx prisma db push && npm run seed && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
